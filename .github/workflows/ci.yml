# CI runs the ROM-independent half of the suite.
#
# The oracle stages need a cartridge and PyBoy, and CI has neither -- so they
# cannot run here and must be run locally before a PR. That is a real limit,
# not an oversight: it is why the unit suite is deliberately built to run
# WITHOUT assets/, on synthetic fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests (no ROM required)
        run: node --test games/batman/tests/

  typecheck:
    # tsc over games/batman/src/ with checkJs. Needs no ROM and no assets, so it
    # is one of the two things CI can genuinely gate.
    #
    # It runs here as well as in tools/test-all.mjs because the whole point of
    # the stage is that a drifted JSDoc cannot rot back in: the defect it was
    # added for -- src/collision.js's probe() documenting a return shape two
    # fields smaller than the one it returns -- is invisible to every
    # behavioural test in the tree, so if this only ever ran locally it would be
    # exactly as forgettable as the comment it checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck (no ROM required)
        run: npm run typecheck

  no-rom-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse ROM images and extracted assets
        run: |
          if git ls-files | grep -Ei '\.(gb|gbc|sav|sym)$'; then
            echo "::error::a ROM image is committed"; exit 1
          fi
          # NOT anchored to the repo root: assets/ and rip/ live under
          # games/<id>/ now, and a '^assets/' pattern stops seeing them the
          # moment a game moves. Match the directory at ANY depth, the way
          # .gitignore's own unanchored patterns do.
          if git ls-files | grep -E '(^|/)(assets|disasm|rip|dist)/'; then
            echo "::error::extracted ROM data is committed"; exit 1
          fi
          # Golden frames are rendered game imagery. .gitignore covers them at
          # any depth via **/tests/visual/golden/, but a gitignore rule only
          # stops an ACCIDENT -- `git add -f` still commits, and neither check
          # above matches this path.
          if git ls-files | grep -E '(^|/)tests/visual/(golden|diff)/'; then
            echo "::error::rendered game imagery is committed"; exit 1
          fi
          echo "clean: no ROM image, no extracted data"
      - name: Refuse bulk ROM literals in game source
        run: |
          # Long hex strings and long byte arrays are how ROM tables used to
          # sneak into source. They belong in assets/manifest.json.
          #
          # THE GUARD IS THE POINT. This used to run `grep -r ... src/`, which
          # exits 2 -- not 1 -- when src/ does not exist. `if` reads a non-zero
          # exit as false, so the step passed forever the moment src/ moved.
          # A check that cannot fail is not a check.
          dirs=$(git ls-files '*/src/*.js' 'src/*.js' | sed -E 's#(^|.*/)src/.*#\1src#' | sort -u)
          if [ -z "$dirs" ]; then
            echo "::error::no src/ tree found to scan -- this check has gone blind"; exit 1
          fi
          echo "scanning: $dirs"
          for d in $dirs; do
            test -d "$d" || { echo "::error::$d is not a directory"; exit 1; }
          done
          if grep -rnoE "'[0-9a-f]{24,}'" $dirs; then
            echo "::error::a long hex literal in game source -- export it instead"; exit 1
          fi
          echo "clean: no bulk ROM literals in $dirs"
