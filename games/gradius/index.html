<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradius (NES) - Mixup</title>
<!--
  STANDALONE. This page does not touch the repo's root launcher and does not
  import anything from it; it exists so the port can be looked at while the
  launcher is being rewritten elsewhere.

  Serve the repo over HTTP (`python -m http.server 8000`) and open
  /games/gradius/. The ES modules and the asset fetches both need a real origin;
  file:// will fail on CORS before it gets anywhere near the game.
-->
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #9aa;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #stage { display: flex; align-items: center; justify-content: center; flex: 1 1 auto; width: 100%; min-height: 0; }
  /*
    image-rendering: pixelated AND an integer scale. Both are needed. On the
    Batman port a fractional scale put the canvas's 1:1 pixels on non-integer
    device pixels and the browser resampled them -- a dithered circle came out
    looking like tetris pieces. main.js's fitCanvas() picks the integer.
  */
  canvas { image-rendering: pixelated; display: block; background: #000; }
  #hud { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; padding: 0 12px 12px; }
  #hud b { color: #cde; font-weight: 600; }
  #err { color: #f88; max-width: 60ch; white-space: pre-wrap; padding: 0 12px; }
  kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 4px; color: #cde; }
  /* The sound control. A real <button>, so it is reachable by keyboard and by
     a screen reader -- but it BLURS ITSELF on click, because a focused button
     swallows the Enter that the game reads as START. */
  #sound {
    background: #1d232d; border: 1px solid #37404f; color: #cde;
    font: inherit; padding: 1px 8px; border-radius: 4px; cursor: pointer;
  }
  #sound[data-on="off"] { color: #889; }
  #audionote { color: #7a8; }

  /* ---- the on-screen pad ------------------------------------------------
     Shown only on a COARSE pointer. On a desktop it is display:none and the
     keyboard path is exactly what it was.

     Lessons carried over from the Game Boy port's pad, each of which cost
     somebody an evening:
       * pointer events, not touch events -- one path for finger, pen, mouse
       * setPointerCapture on press, so a finger that slides off a control
         still delivers its release to it. Without it you get a stuck button.
       * touch-action: none and preventDefault, or the browser scrolls the page
         and steals the gesture mid-press
       * START is stacked ABOVE the face buttons. Inline, the cluster is wider
         than the space beside the d-pad and the rightmost button is pushed off
         the edge of a narrow phone.
     What is NOT copied from there: the d-pad. Four captured buttons cannot
     report a diagonal, and Gradius needs diagonals (src/player.js tests X and
     Y independently -- there is no diagonal case, just two bits). So the d-pad
     here is ONE capture target, hit-tested as a 3x3 grid by dpadMask(). */
  #pad { display: none; }
  body.touch #hud .keyhint { display: none; }
  #pad.on {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 620px; box-sizing: border-box;
    gap: 10px; padding: 0 14px 16px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad {
    display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px);
    background: #10141a; border: 1px solid #2b3340; border-radius: 14px; padding: 3px;
    touch-action: none;
  }
  .dpad i {
    display: flex; align-items: center; justify-content: center;
    font-style: normal; font-size: 15px; color: #6b7686;
    border-radius: 9px; margin: 2px; background: #1a2028;
  }
  .dpad i[data-cell=""] { background: transparent; }
  .dpad i[data-on] { background: #2f6ea8; color: #eaf3ff; }
  .cluster { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .row { display: flex; gap: 14px; align-items: center; }
  .tbtn {
    background: #1d232d; border: 1px solid #37404f; color: #cde;
    font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    width: 62px; height: 62px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer; padding: 0;
  }
  .tbtn.sml { width: 68px; height: 28px; border-radius: 6px; font-size: 10px; }
  .tbtn[data-on] { background: #2f6ea8; border-color: #4d92cf; color: #fff; }
  /*
    Landscape is how a phone gets held for a horizontal shooter, and there the
    canvas is tall and narrow enough to leave real estate on both sides: put
    the pad in the letterbox rather than under the picture, so #stage keeps the
    full height and fitCanvas() can pick a bigger INTEGER scale.
    pointer-events is off on the container and back on for the two clusters, so
    the invisible strip across the middle cannot swallow a tap on the canvas.
  */
  @media (orientation: landscape) and (max-height: 560px) {
    #pad.on {
      position: fixed; left: 0; right: 0; bottom: 0; max-width: none;
      padding: 0 12px 10px; pointer-events: none;
    }
    #pad.on .dpad, #pad.on .cluster { pointer-events: auto; }
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen" width="256" height="240"></canvas></div>
  <div id="hud">
    <span class="keyhint"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> move</span>
    <!-- WAVE 11 CORRECTED THIS LINE AND THE ONE BELOW. Both said "not ported"
         and both had been wrong since wave 6: X is A and fires ($A0E9), Z is B
         and applies a power-up ($8974), Enter is START and pauses ($9ADA), and
         since this commit the enemies shoot back ($BC59). A stale hint on the
         page is the one piece of documentation a player reads. -->
    <span class="keyhint"><kbd>X</kbd> fire &middot; <kbd>Z</kbd> power-up
      &middot; <kbd>Enter</kbd> pause</span>
    <!-- WAVE 13 ADDED THE SOUND. Wave 8 ported the $ED02 driver state-exact and
         nothing listened to it; src/audio/apu.js is the chip it was writing to.
         Browsers refuse to start audio before a user gesture, so the page says
         what it is waiting for rather than being mysteriously silent. -->
    <span id="audionote">Sound starts on your first key or tap.</span>
    <button id="sound" type="button" data-on="on" aria-pressed="false"
            title="Mute the sound. The synthesiser keeps running, so unmuting
                   resumes exactly where the music got to.">&#9835; sound on</button>
    <span id="stats"></span>
    <span class="touchnote" hidden>A fires, B applies the meter's power-up and
      START pauses. SELECT reaches $0007 and nothing reads it.</span>
  </div>

  <!--
    The pad's LAYOUT is here; the BITS are TOUCH_BUTTONS in src/input.js, looked
    up through these data-* names. game.json's input.touchLayout is the written
    description of this arrangement and tests/input.test.js holds all three
    against each other, so a typo here is a red test and not a dead button.

    The nine <i> cells are decoration -- they light up, they are not pointer
    targets. The grid itself is the target (see the CSS note).
  -->
  <div id="pad">
    <div class="dpad" id="dpad">
      <i data-cell="UP LEFT">&#9700;</i><i data-cell="UP">&#9650;</i><i data-cell="UP RIGHT">&#9701;</i>
      <i data-cell="LEFT">&#9664;</i><i data-cell="">&middot;</i><i data-cell="RIGHT">&#9654;</i>
      <i data-cell="DOWN LEFT">&#9699;</i><i data-cell="DOWN">&#9660;</i><i data-cell="DOWN RIGHT">&#9698;</i>
    </div>
    <div class="cluster">
      <div class="row">
        <button class="tbtn sml" type="button" data-btn="SELECT">SELECT</button>
        <button class="tbtn sml" type="button" data-btn="START">START</button>
      </div>
      <div class="row">
        <button class="tbtn" type="button" data-btn="B">B</button>
        <button class="tbtn" type="button" data-btn="A">A</button>
      </div>
    </div>
  </div>

  <div id="err"></div>

<script type="module">
import { boot, fitCanvas } from './src/main.js';
import {
  TOUCH_BUTTONS, setTouchButton, setTouchDirections, clearTouchButtons, dpadMask,
} from './src/input.js';
import { GradiusAudio } from './src/audio/output.js';

const canvas = document.getElementById('screen');
const stage = document.getElementById('stage');
const stats = document.getElementById('stats');
const err = document.getElementById('err');
const soundBtn = document.getElementById('sound');
const audioNote = document.getElementById('audionote');

// ---- sound -----------------------------------------------------------------
//
// AUTOPLAY POLICY, and what this page actually does about it. Every browser
// refuses to start an AudioContext outside a user gesture, and a page that
// creates one anyway ends up permanently suspended and silent with nothing on
// screen saying why. So the AudioContext is NOT created until the first
// pointerdown or keydown, the note in the HUD says so until it happens, and the
// game runs at full speed silently in the meantime -- audio never gates the
// simulation (src/audio/output.js).
//
// The listeners are in the CAPTURE phase and on window, so they fire before the
// pad's own handlers call preventDefault(); a prevented default does not stop
// the event being a user gesture, but the arming must happen synchronously
// inside the handler and capture is the cheapest way to be sure it does.
const audio = new GradiusAudio((e) => {
  // UNHIDDEN, not just rewritten: by the time this can fire the note has
  // already been hidden by a successful arm(), and a message written into a
  // hidden element is the silent failure this page keeps being bitten by.
  // The picture keeps running -- only the sound has stopped.
  audioNote.hidden = false;
  audioNote.textContent = `Sound stopped: ${e.message}`;
  console.error(e);
});
function armAudio() {
  audio.arm();
  if (audio.status === 'on') {
    audioNote.hidden = true;
    removeEventListener('pointerdown', armAudio, true);
    removeEventListener('keydown', armAudio, true);
  } else if (audio.status === 'unsupported') {
    audioNote.textContent = 'This browser has no Web Audio; the port runs silent.';
  }
}
addEventListener('pointerdown', armAudio, true);
addEventListener('keydown', armAudio, true);

soundBtn.addEventListener('click', () => {
  audio.setMuted(!audio.muted);
  soundBtn.dataset.on = audio.muted ? 'off' : 'on';
  soundBtn.textContent = audio.muted ? '♫ muted' : '♫ sound on';
  soundBtn.setAttribute('aria-pressed', String(audio.muted));
  // A focused button eats the Enter key, and Enter is START ($9ADA). Give the
  // keyboard back to the game.
  soundBtn.blur();
});

// ---- on-screen controls ----------------------------------------------------
//
// Shown on a COARSE pointer only. This runs BEFORE the first fit() so the pad
// is already taking its space when fitCanvas() measures the stage -- otherwise
// the first integer scale is computed against a height the canvas is about to
// lose, and the picture is re-scaled a frame later.
const pad = document.getElementById('pad');
const dpadEl = document.getElementById('dpad');
if (matchMedia('(pointer: coarse)').matches) {
  pad.classList.add('on');
  document.body.classList.add('touch');
  for (const n of document.querySelectorAll('.touchnote')) n.hidden = false;
}

// Face buttons. One control, one bit, resolved through TOUCH_BUTTONS so the
// bit layout is spelled once (in src/input.js) and this file only names
// buttons.
for (const b of pad.querySelectorAll('.tbtn')) {
  const bit = TOUCH_BUTTONS[b.dataset.btn] ?? 0;
  const press = (e) => {
    e.preventDefault();
    // The finger may slide off the button; the capture keeps its release ours.
    b.setPointerCapture?.(e.pointerId);
    b.dataset.on = '1';
    setTouchButton(bit, true);
  };
  const release = (e) => {
    e.preventDefault();
    delete b.dataset.on;
    setTouchButton(bit, false);
  };
  b.addEventListener('pointerdown', press);
  b.addEventListener('pointerup', release);
  b.addEventListener('pointercancel', release);
  // Fires after a normal pointerup too (release is idempotent), and covers the
  // case a normal pointerup never comes because the capture was taken away.
  b.addEventListener('lostpointercapture', release);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
}

// The d-pad: ONE capture target, hit-tested. Four separate captured buttons
// cannot report a diagonal -- the capture that stops a stuck direction is also
// what stops a second button ever seeing the finger -- and this game needs
// diagonals to be flyable at all.
const cells = [...dpadEl.querySelectorAll('i')].map((el) => ({
  el,
  mask: (el.dataset.cell || '').split(/\s+/).filter(Boolean)
    .reduce((m, n) => m | (TOUCH_BUTTONS[n] ?? 0), 0),
}));
// One finger owns the pad at a time, so a second finger landing on it can
// neither steal the direction nor clear it on ITS release.
let padPointer = null;

function paintDpad(mask) {
  for (const c of cells) {
    if (c.mask && (mask & c.mask) === c.mask) c.el.dataset.on = '1';
    else delete c.el.dataset.on;
  }
}

function applyDpad(e) {
  const r = dpadEl.getBoundingClientRect();
  const m = dpadMask(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
  setTouchDirections(m);
  paintDpad(m);
}

dpadEl.addEventListener('pointerdown', (e) => {
  if (padPointer !== null) return;
  e.preventDefault();
  padPointer = e.pointerId;
  dpadEl.setPointerCapture?.(e.pointerId);
  applyDpad(e);
});
dpadEl.addEventListener('pointermove', (e) => {
  if (e.pointerId !== padPointer) return;
  e.preventDefault();
  applyDpad(e);        // slide from LEFT into UP+LEFT without lifting
});
const dpadEnd = (e) => {
  if (e.pointerId !== padPointer) return;
  e.preventDefault();
  padPointer = null;
  setTouchDirections(0);
  paintDpad(0);
};
dpadEl.addEventListener('pointerup', dpadEnd);
dpadEl.addEventListener('pointercancel', dpadEnd);
dpadEl.addEventListener('lostpointercapture', dpadEnd);
dpadEl.addEventListener('contextmenu', (e) => e.preventDefault());

// The backstop: anything the controls never see -- a call, the app switcher,
// the browser deciding the gesture was a scroll -- clears the WHOLE mask.
// Without it the last direction held stays held forever and the ship flies
// into a wall while the phone is in a pocket.
function clearTouch() {
  clearTouchButtons();
  padPointer = null;
  paintDpad(0);
  for (const b of pad.querySelectorAll('.tbtn')) delete b.dataset.on;
}
addEventListener('blur', clearTouch);
addEventListener('pagehide', clearTouch);
document.addEventListener('visibilitychange', () => { if (document.hidden) clearTouch(); });

// Integer device-pixel scaling, recomputed on resize and on a DPR change (a
// window dragged between a laptop screen and an external monitor changes
// devicePixelRatio without firing anything else useful). A fractional scale
// resamples the 1:1 pixels and visibly wrecks the dithering, so fitCanvas()
// floors -- do not "fix" it into a percentage.
const fit = () => fitCanvas(canvas, stage);
addEventListener('resize', fit);
// A phone rotating changes the stage's shape without a resize on some
// browsers, and the URL bar sliding away only moves the visual viewport.
addEventListener('orientationchange', fit);
window.visualViewport?.addEventListener('resize', fit);
fit();

// showError is used by BOTH channels: the boot-time catch below, and onError,
// which is the only way a mid-flight failure can reach this page at all. A
// throw inside the frame loop happens long after boot() has resolved, so the
// try/catch cannot see it -- the loop just stops and the canvas freezes. That
// is what "softlocks and screen freezes" turned out to be.
function showError(e, when) {
  err.style.display = 'block';
  err.textContent = `${when}\n\n${String(e && e.message || e)}\n\n`
    + 'The frame loop has stopped. Reload to start again.\n'
    + 'If the message names a ROM address, that path is not ported yet -- '
    + 'this is the port telling you exactly where it ran out, not a mystery crash.';
  console.error(e);
}

try {
  const app = await boot(canvas, {
    // The named throws are the port's most useful output. Losing them to a
    // silent freeze wasted a real play session.
    onError: (e) => showError(e, 'The port reached something it has not ported.'),
    // One batch of APU register writes per LOGIC frame, played back on the
    // AudioContext's clock. Nothing here can affect what a frame computes.
    audio,
  });
  // The frame rate is NOT spelled here. It comes from game.json via main.js:
  // 60.098814 Hz, derived (NTSC PPU 5369318.18 / 89341.5) rather than rounded.
  setInterval(() => {
    const s = app.state;
    const a = audio.stats();
    // ---- WAVE 14: k, AND THE ONLY PLACE IT CAN BE READ -----------------------
    // k is how many LOGIC frames one animation-frame callback ran.
    // docs/worklog/gradius/13-FINDING-input-granularity-under-load.md asked for
    // this number and nobody could produce it, because it lived inside a closure
    // inside requestAnimationFrame. `avg` is logic frames per callback over the
    // whole session -- 1.00 means the loop is keeping up -- and `max` is the
    // worst burst, which is the number that says whether catch-up ever engaged
    // at all. `q` is the input queue's depth (src/input.js): it should read 0
    // almost always, and a value stuck at the cap means events are arriving
    // faster than logic frames are consuming them.
    //
    // THIS IS NOT DECORATION. There is no browser in this repo's test suite, so
    // this readout is the measurement, and the owner reading it off a real
    // machine is how the "unresponsive at the start" report gets closed.
    const L = app.loopStats();
    const q = app.inputStats();
    const avg = L.callbacks ? (L.logicFrames / L.callbacks) : 0;
    // The audio numbers are on the page on purpose. `drop` is logic frames
    // whose samples were thrown away because the host stalled past the
    // backlog ceiling, and `under` is times the scheduler ran dry -- both are
    // quality losses that would otherwise be silent, which is how this repo
    // has been bitten before.
    const snd = a.rate
      ? `${a.status} ${(a.rate / 1000).toFixed(1)}k q${a.backlog}`
        + (a.dropped ? ` drop${a.dropped}` : '')
        + (a.underruns ? ` under${a.underruns}` : '')
      : a.status;
    stats.innerHTML = `<b>$0360</b> ${s.obj.x[0]} <b>$0320</b> ${s.obj.y[0]}`
      + ` &nbsp; <b>cam</b> ${(s.cam.hi << 8) | s.cam.lo}px`
      + ` &nbsp; <b>$0120</b> ${s.obj.anim[0]}`
      + ` &nbsp; <b>lag</b> ${s.lagFrames}`
      + ` &nbsp; <b>k</b> ${avg.toFixed(2)}avg/${L.maxK}max`
        + (L.clamped ? `/${L.clamped}clamped` : '')
      // WAVE 15: `coalesced` USED TO BE PRINTED AS "lost" AND IT IS NOT A LOSS.
      // A merge at the cap drops an intermediate LEVEL and carries every
      // undelivered press forward (src/input.js), so on a phone `merged` runs
      // into the hundreds during ordinary steering and nothing is wrong.
      // `lost` is now the one counter that means an input the player made
      // produced no edge at all, and it must stay at 0.
      + ` &nbsp; <b>inq</b> ${q.depth}`
        + (q.coalesced ? `/${q.coalesced}merged` : '')
        + (q.carried ? `/${q.carried}carried` : '')
        + (q.lostEdges ? `/${q.lostEdges}LOST` : '')
      + ` &nbsp; <b>snd</b> ${snd}`;
  }, 100);
} catch (e) {
  // Say what is missing and how to make it, rather than leaving a black canvas.
  // A zero-filled tile sheet renders a perfectly plausible empty starfield.
  showError(e, 'The game could not start.');
}
</script>
</body>
</html>
