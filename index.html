<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batman: Return of the Joker - JS port</title>
<style>
  :root { --bg: #12141a; --fg: #d8dee9; --dim: #7a869a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.25rem; padding: 2rem 1rem;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: .04em; }
  h1 span { color: var(--dim); font-weight: 400; }
  #screen {
    image-rendering: pixelated;
    width: 640px; height: 576px;   /* integer 4x of 160x144 */
    max-width: 100%; height: auto; aspect-ratio: 160 / 144;
    background: #0f380f;
    border: 1px solid #2a2f3a; border-radius: 4px;
  }
  .keys { color: var(--dim); font-size: 12px; text-align: center; }
  .keys b { color: var(--fg); font-weight: 600; }
  #err {
    display: none; max-width: 640px; padding: .75rem 1rem;
    background: #2a1a1a; border: 1px solid #5a2a2a; border-radius: 4px;
    color: #ffb4b4; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>Batman: Return of the Joker <span>— JavaScript port, phase 1</span></h1>
  <canvas id="screen" width="160" height="144"></canvas>
  <div class="keys">
    <b>&larr; &rarr;</b> walk &nbsp;·&nbsp; <b>X</b> jump &nbsp;·&nbsp;
    <b>Z</b> attack &nbsp;·&nbsp; <b>Enter</b> start
  </div>
  <div id="err"></div>

<script type="module">
  import { boot } from './src/main.js';

  const err = document.getElementById('err');
  try {
    const game = await boot(document.getElementById('screen'), { level: 1 });
    window.game = game;          // handy in the console: game.state.player
  } catch (e) {
    err.style.display = 'block';
    err.textContent = `${e.message}\n\nServe this over HTTP (module imports and fetch do not work from file://):\n  python -m http.server 8000`;
    throw e;
  }
</script>
</body>
</html>
